<style>
  :root {
    --bg: #eef4ff;
    --panel: #ffffff;
    --sidebar: #0b1220;
    --sidebar-alt: #122235;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-soft: #e0ecff;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e2e8f0;
    --shadow: 0 18px 38px rgba(15, 23, 42, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    min-height: 100%;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #f5f7ff 0%, #eef4ff 100%);
    color: var(--text);
    line-height: 1.5;
  }

  .app-shell {
    display: flex;
    min-height: 100vh;
    background: var(--bg);
  }

  .sidebar {
    width: 260px;
    background: var(--sidebar);
    color: #fff;
    padding: 24px 18px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 1px solid rgba(255, 255, 255, 0.06);
  }

  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    padding: 8px 10px 14px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  }

  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: #fff;
    font-size: 0.84rem;
    font-weight: 800;
    letter-spacing: 0.06em;
  }

  .brand-name {
    font-size: 1.05rem;
    font-weight: 700;
  }

  .brand-subtitle {
    font-size: 0.75rem;
    color: rgba(191, 219, 254, 0.82);
  }

  .sidebar-footer {
    margin-top: 24px;
    padding: 14px 12px 0;
    border-top: 1px solid rgba(148, 163, 184, 0.18);
  }

  .sidebar-status {
    font-size: 0.74rem;
    letter-spacing: 0.08em;
    color: rgba(191, 219, 254, 0.75);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .nav-group-label {
    padding: 12px 12px 4px;
    color: #93a4bc;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .nav-group-spaced {
    margin-top: 18px;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 12px;
    color: #dfeafc;
    text-decoration: none;
    transition: all 0.2s ease;
    font-weight: 600;
  }

  .nav-item:hover,
  .nav-item.active {
    background: var(--sidebar-alt);
    box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.25);
  }

  .nav-item.active {
    color: #ffffff;
    box-shadow: inset 3px 0 0 #38bdf8, inset 0 0 0 1px rgba(96, 165, 250, 0.18);
  }

  .nav-icon {
    width: 20px;
    text-align: center;
    color: #bfdbfe;
    font-size: 0.9rem;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 0.74rem;
    font-weight: 700;
  }

  .status-pill.online {
    background: rgba(34, 197, 94, 0.15);
    color: #bbf7d0;
  }

  .main-panel {
    flex: 1;
    padding: 26px 28px 40px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    padding: 18px 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }

  .eyebrow {
    margin: 0 0 4px;
    color: #3b82f6;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.72rem;
    font-weight: 700;
  }

  .topbar h1 {
    margin: 0;
    font-size: clamp(1.7rem, 2vw, 2.2rem);
    color: #0f172a;
  }

  .admin-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 12px;
    background: linear-gradient(90deg, #eff6ff, #dbeafe);
    border: 1px solid #bfdbfe;
    color: #1d4ed8;
    font-weight: 700;
    margin-bottom: 18px;
    box-shadow: 0 8px 18px rgba(59, 130, 246, 0.08);
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .icon-button {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-size: 1.15rem;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .icon-button:hover {
    transform: translateY(-2px);
    background: var(--primary-soft);
  }

  .header-search {
    padding: 10px 14px;
    border-radius: 10px;
    background: #f8fafc;
    border: 1px solid var(--border);
    color: #94a3b8;
    font-size: 0.8rem;
    min-width: 120px;
  }

  .badge {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .badge.neutral {
    background: #e5e7eb;
    color: #374151;
  }

  .badge.success {
    background: #dcfce7;
    color: #166534;
  }

  .badge.warning {
    background: #fef3c7;
    color: #92400e;
  }

  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.2s ease;
  }

  .btn:hover {
    opacity: 0.96;
  }

  .btn-primary {
    background: var(--primary);
    color: white;
  }

  .btn-primary:hover {
    background: var(--primary-dark);
  }

  .btn-secondary {
    background: #e8eef7;
    color: #243448;
    border: 1px solid #d5dfeb;
  }

  body[data-theme="dark"] .btn-secondary {
    background: #263846;
    color: #e5edf5;
    border-color: #3a4c5b;
  }

  .content {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .view-panel {
    animation: view-enter 0.28s ease both;
  }

  @keyframes view-enter {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-header {
    margin-bottom: 14px;
  }

  .panel-header h2 {
    margin: 0;
    font-size: 1.25rem;
  }

  .section-kicker {
    margin: 0 0 3px;
    color: #0f766e;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .workflow-chart {
    display: grid;
    gap: 16px;
    max-width: 850px;
  }

  .workflow-row {
    display: grid;
    grid-template-columns: minmax(145px, 190px) 1fr 46px;
    align-items: center;
    gap: 14px;
    font-size: 0.86rem;
  }

  .workflow-label {
    color: var(--text);
    font-weight: 600;
  }

  .workflow-track {
    height: 11px;
    overflow: hidden;
    background: #e8eef7;
    border-radius: 99px;
  }

  .workflow-bar {
    height: 100%;
    min-width: 0;
    border-radius: inherit;
    transform-origin: left;
    animation: bar-enter 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes bar-enter {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  .workflow-count {
    text-align: right;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  .workflow-draft { background: #64748b; }
  .workflow-ack { background: #0ea5e9; }
  .workflow-hod { background: #f59e0b; }
  .workflow-returned { background: #ef4444; }
  .workflow-approved { background: #16a34a; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 16px;
  }

  .summary-card,
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .summary-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 42px rgba(15, 23, 42, 0.12);
  }

  .summary-label {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }

  .summary-value {
    font-size: 2rem;
    font-weight: 700;
  }

  .system-state {
    line-height: 1.6;
    color: var(--text);
  }

  .user-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .table-scroll {
    overflow-x: auto;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    font-size: 0.88rem;
  }

  .data-table th,
  .data-table td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .data-table th {
    color: var(--muted);
    background: var(--bg);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .data-table tbody tr:hover {
    background: var(--primary-soft);
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }

  .setting-row:last-child {
    border-bottom: 0;
  }

  .setting-description {
    color: var(--muted);
    font-size: 0.86rem;
    margin-top: 4px;
  }

  .switch-control {
    position: relative;
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
  }

  .switch-control input {
    position: absolute;
    opacity: 0;
  }

  .switch-track {
    width: 46px;
    height: 26px;
    border-radius: 99px;
    background: #cbd5e1;
    transition: background 0.2s ease;
    cursor: pointer;
  }

  .switch-track::after {
    content: "";
    display: block;
    width: 20px;
    height: 20px;
    margin: 3px;
    border-radius: 50%;
    background: #ffffff;
    transition: transform 0.2s ease;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.2);
  }

  .switch-control input:checked + .switch-track {
    background: #2563eb;
  }

  .switch-control input:checked + .switch-track::after {
    transform: translateX(20px);
  }

  .switch-control input:focus-visible + .switch-track {
    outline: 3px solid rgba(37, 99, 235, 0.25);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  body[data-theme="dark"] {
    --bg: #101923;
    --panel: #182530;
    --text: #e5edf5;
    --muted: #a1b2c3;
    --border: #2c3b48;
    --primary-soft: #20394b;
    --shadow: 0 18px 38px rgba(0, 0, 0, 0.18);
    background: #101923;
    color: var(--text);
  }

  body[data-theme="dark"] .main-panel,
  body[data-theme="dark"] .app-shell {
    background: var(--bg);
  }

  body[data-theme="dark"] .topbar h1,
  body[data-theme="dark"] .panel-header h2,
  body[data-theme="dark"] .setting-row strong {
    color: #f1f5f9;
  }

  body[data-theme="dark"] .header-search,
  body[data-theme="dark"] .workflow-track,
  body[data-theme="dark"] .data-table th {
    background: #202f3b;
    border-color: var(--border);
  }

  body[data-theme="dark"] .stat-box {
    background: var(--panel);
    border-color: var(--border);
  }

  body[data-theme="dark"] .data-table td {
    border-color: var(--border);
  }

  body[data-theme="dark"] .data-table tbody tr:hover {
    background: #20394b;
  }

  body[data-theme="dark"] .admin-banner {
    background: #1e3445;
    border-color: #315572;
    color: #bfdbfe;
  }

  body[data-theme="dark"] .alert.success {
    background: #173a2c;
    color: #bbf7d0;
  }

  body[data-theme="dark"] .alert.error {
    background: #451f27;
    color: #fecaca;
  }

  body[data-theme="dark"] .badge.neutral {
    background: #334454;
    color: #e2e8f0;
  }

  .alert {
    border-radius: 10px;
    padding: 12px 14px;
    font-weight: 600;
    margin-bottom: 18px;
  }

  .alert.success {
    background: #dcfce7;
    color: #166534;
  }

  .alert.error {
    background: #fee2e2;
    color: #991b1b;
  }

  .hidden {
    display: none;
  }

  @media (max-width: 900px) {
    .app-shell {
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      min-height: auto;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    }

    .nav-group-label {
      grid-column: 1 / -1;
    }

    .sidebar-footer {
      display: none;
    }

    .topbar {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .main-panel {
      padding: 20px 18px 30px;
    }

    .workflow-row {
      grid-template-columns: minmax(110px, 145px) 1fr 34px;
      gap: 9px;
    }

    .summary-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }

  @media (max-width: 540px) {
    .topbar-actions {
      width: 100%;
    }

    .header-search {
      display: none;
    }

    .setting-row {
      align-items: flex-start;
    }

    .workflow-row {
      grid-template-columns: 1fr 36px;
    }

    .summary-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .workflow-track {
      grid-column: 1 / -1;
      grid-row: 2;
    }
  }
</style>
